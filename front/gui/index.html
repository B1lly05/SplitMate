<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitMate</title>
  <link rel="stylesheet" href="/front/gui/estilos.css">
</head>
<body>
  <main>
    <h1>SplitMate</h1>
    <p class="lema">Reparte gastos con tus amigos.</p>
    <noscript><p class="mensaje error">Esta aplicación necesita JavaScript.</p></noscript>

    <section id="pantalla-login" hidden>
      <h2>Iniciar sesión</h2>
      <form id="form-login">
        <label>Email
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p id="mensaje-login" class="mensaje" role="alert"></p>
      <p>¿No tienes cuenta? <a href="#" id="ir-registro">Regístrate</a></p>
    </section>

    <section id="pantalla-registro" hidden>
      <h2>Crear cuenta</h2>
      <form id="form-registro">
        <label>Email
          <input type="email" id="registro-email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input type="password" id="registro-password" autocomplete="new-password" required>
        </label>
        <button type="submit">Registrarme</button>
      </form>
      <p id="mensaje-registro" class="mensaje" role="alert"></p>
      <p>¿Ya tienes cuenta? <a href="#" id="ir-login">Inicia sesión</a></p>
    </section>

    <section id="pantalla-cuenta" hidden>
      <h2>Tu cuenta</h2>
      <dl>
        <dt>Email</dt><dd id="cuenta-email"></dd>
        <dt>Rol</dt><dd id="cuenta-rol"></dd>
        <dt>Estado</dt><dd id="cuenta-estado"></dd>
      </dl>
      <button type="button" id="boton-logout">Cerrar sesión</button>
    </section>
  </main>
  <script type="module" src="/front/controlador/controlador.js"></script>
</body>
</html>
